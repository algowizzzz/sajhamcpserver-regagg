# Federal Deposit Insurance Corporation
# STATUS: candidate sources — run scripts/verify_sources.py before build. See 06_SOURCE_MAP.md
id: fdic
name: "Federal Deposit Insurance Corporation"
jurisdiction: US
active: true
connector: rss
sources:
  feeds:
    - url: https://www.fdic.gov/rss/press-releases.xml
      verified: false
      checked_at: null
    - url: https://www.fdic.gov/rss/financial-institution-letters.xml
      verified: false
      checked_at: null
fetch: html_to_md
rate_limit_rps: 0.5
schedule: daily_morning
include_patterns: []        # tighten after verification
exclude_patterns: ["\\.(jpg|png|gif|css|js|zip)$"]
default_tags:
  - us
  - banking
doc_type_rules:
  - pattern: "/financial-institution-letters/"
    doc_type: guidance
  - pattern: "/press-releases/"
    doc_type: announcement
staleness_alert_days: 14
backfill_cutoff: 2024-08-01
notes: "FILs -> guidance."
