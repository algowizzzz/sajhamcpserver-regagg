# Monetary Authority of Singapore
# STATUS: candidate sources — run scripts/verify_sources.py before build. See 06_SOURCE_MAP.md
id: mas
name: "Monetary Authority of Singapore"
jurisdiction: SG
active: true
# Discovery pass 2026-08-03: RSS 404, sitemap serves HTML; publications+news listings
connector: sitemap_diff
sources:
  listing_pages:
    - url: https://www.mas.gov.sg/publications
      verified: false
      checked_at: null
    - url: https://www.mas.gov.sg/news
      verified: false
      checked_at: null
fetch: html_to_md
rate_limit_rps: 0.5
schedule: daily_morning
include_patterns: []        # tighten after verification
exclude_patterns: ["\\.(jpg|png|gif|css|js|zip)$"]
default_tags:
  - singapore
  - banking
  - securities
doc_type_rules:
  - pattern: "/regulation/notices"
    doc_type: final_rule
  - pattern: "/publications/consultations"
    doc_type: consultation
  - pattern: "/news/"
    doc_type: announcement
staleness_alert_days: 14
backfill_cutoff: 2024-08-01
notes: "May need playwright; verification decides."
