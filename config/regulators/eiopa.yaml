# European Insurance and Occupational Pensions Authority
# STATUS: candidate sources — run scripts/verify_sources.py before build. See 06_SOURCE_MAP.md
id: eiopa
name: "European Insurance and Occupational Pensions Authority"
jurisdiction: EU
active: true
# Discovery pass 2026-08-03: rss.xml is 404; site sitemap.xml live (618KB xml)
connector: sitemap_diff
sources:
  sitemap:
    url: https://www.eiopa.europa.eu/sitemap.xml
    verified: false
    checked_at: null
  listing_pages:
    - url: https://www.eiopa.europa.eu/publications_en
      verified: false
      checked_at: null
fetch: pdf_to_md
rate_limit_rps: 0.5
schedule: daily_morning
include_patterns: []        # tighten after verification
exclude_patterns: ["\\.(jpg|png|gif|css|js|zip)$"]
default_tags:
  - eu
  - insurance
  - pensions
doc_type_rules:
  - pattern: "consultation"
    doc_type: consultation
  - pattern: "guidelines"
    doc_type: guidance
  - pattern: "news"
    doc_type: announcement
staleness_alert_days: 14
backfill_cutoff: 2024-08-01
