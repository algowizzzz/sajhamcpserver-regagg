# European Securities and Markets Authority
# STATUS: candidate sources — run scripts/verify_sources.py before build. See 06_SOURCE_MAP.md
id: esma
name: "European Securities and Markets Authority"
jurisdiction: EU
active: true
connector: rss
sources:
  feeds:
    - url: https://www.esma.europa.eu/rss.xml
      verified: false
      checked_at: null
  listing_pages:
    - url: https://www.esma.europa.eu/databases-library/esma-library
      verified: false
      checked_at: null
fetch: pdf_to_md
rate_limit_rps: 0.5
schedule: daily_morning
include_patterns: []        # tighten after verification
exclude_patterns: ["\\.(jpg|png|gif|css|js|zip)$"]
default_tags:
  - eu
  - securities
  - derivatives
doc_type_rules:
  - pattern: "consultation"
    doc_type: consultation
  - pattern: "final-report"
    doc_type: final_rule
  - pattern: "press"
    doc_type: announcement
staleness_alert_days: 14
backfill_cutoff: 2024-08-01
notes: "EMIR/MiFID; library differ as backup."
