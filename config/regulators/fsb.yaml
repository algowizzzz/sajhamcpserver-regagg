# Financial Stability Board
# STATUS: candidate sources — run scripts/verify_sources.py before build. See 06_SOURCE_MAP.md
id: fsb
name: "Financial Stability Board"
jurisdiction: INTL
active: true
connector: rss
sources:
  feeds:
    - url: https://www.fsb.org/feed/
      verified: false
      checked_at: null
  listing_pages:
    - url: https://www.fsb.org/publications/
      verified: false
      checked_at: null
fetch: pdf_to_md
rate_limit_rps: 0.5
schedule: daily_morning
include_patterns: []        # tighten after verification
exclude_patterns: ["\\.(jpg|png|gif|css|js|zip)$"]
default_tags:
  - international
  - financial_stability
doc_type_rules:
  - pattern: "/publications/"
    doc_type: report
  - pattern: "/press/"
    doc_type: announcement
staleness_alert_days: 14
backfill_cutoff: 2024-08-01
