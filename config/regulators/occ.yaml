# Office of the Comptroller of the Currency
# STATUS: candidate sources — run scripts/verify_sources.py before build. See 06_SOURCE_MAP.md
id: occ
name: "Office of the Comptroller of the Currency"
jurisdiction: US
active: true
connector: rss
sources:
  feeds:
    - url: https://www.occ.gov/rss/occ_bulletins.xml
      verified: false
      checked_at: null
    - url: https://www.occ.gov/rss/occ_news.xml
      verified: false
      checked_at: null
fetch: html_to_md
rate_limit_rps: 0.5
schedule: daily_morning
include_patterns: []        # tighten after verification
exclude_patterns: ["\\.(jpg|png|gif|css|js|zip)$"]
default_tags:
  - us
  - banking
  - prudential
doc_type_rules:
  - pattern: "/bulletins/"
    doc_type: guidance
  - pattern: "/news-releases/"
    doc_type: announcement
staleness_alert_days: 14
backfill_cutoff: 2024-08-01
notes: "Bulletins listing page as backup differ."
