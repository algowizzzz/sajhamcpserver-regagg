# Hong Kong Monetary Authority
# STATUS: candidate sources — run scripts/verify_sources.py before build. See 06_SOURCE_MAP.md
id: hkma
name: "Hong Kong Monetary Authority"
jurisdiction: HK
active: true
# Discovery pass 2026-08-03: 3.8MB sitemap hangs resolution — listing-first. Prior note: RSS endpoints removed (404). Site ships a full
# sitemap.xml (~3.8MB) — switched to sitemap_diff scoped by include_patterns
# to the EN press-release + circular/guideline sections.
connector: sitemap_diff
sources:
  listing_pages:
    - url: https://www.hkma.gov.hk/eng/news-and-media/press-releases/
      verified: false
      checked_at: null
fetch: html_to_md
rate_limit_rps: 0.5
schedule: daily_morning
include_patterns:
  - "/eng/news-and-media/press-releases/.+"
  - "/eng/regulatory-resources/.+"
exclude_patterns: ["\\.(jpg|png|gif|css|js|zip)$"]
default_tags:
  - hong_kong
  - banking
doc_type_rules:
  - pattern: "/circulars/"
    doc_type: guidance
  - pattern: "/press-releases/"
    doc_type: announcement
staleness_alert_days: 14
backfill_cutoff: 2024-08-01
notes: "Circulars = supervisory layer; EN pages."
