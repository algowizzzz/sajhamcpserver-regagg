# Expected-inventory for OSFI — powers "9/9 chapters present" completeness checks.
# STATUS: seeded from public knowledge of OSFI's guideline index (2026); each
# series should be confirmed against https://www.osfi-bsif.gc.ca/en/guidance
# before being treated as authoritative. Reconciliation matches corpus documents
# by reference-number slug first, then title substring (case-insensitive).

regulator_id: osfi
verified_against_site: false      # flip after a human confirms the lists
series:
