      - {ref: "CAR-Ch5", title: "Chapter 5 — Credit Risk – Internal Ratings-Based"}
      - {ref: "CAR-Ch6", title: "Chapter 6 — Securitization"}
      - {ref: "CAR-Ch7", title: "Chapter 7 — Settlement and Counterparty Risk"}
      - {ref: "CAR-Ch8", title: "Chapter 8 — Credit Valuation Adjustment"}
      - {ref: "CAR-Ch9", title: "Chapter 9 — Market Risk"}
  - name: "Liquidity Adequacy Requirements (LAR)"
    match: reference
    items:
      - {ref: "LAR-Ch1", title: "Chapter 1 — Overview"}
