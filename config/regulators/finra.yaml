# Financial Industry Regulatory Authority
# STATUS: candidate sources — run scripts/verify_sources.py before build. See 06_SOURCE_MAP.md
id: finra
name: "Financial Industry Regulatory Authority"
jurisdiction: US
active: true
connector: rss
sources:
  feeds:
    - url: https://www.finra.org/about/news-events/rss-feeds/regulatory-notices
      verified: false
      checked_at: null
  listing_pages:
    - url: https://www.finra.org/rules-guidance/notices
      verified: false
      checked_at: null
fetch: html_to_md
rate_limit_rps: 0.5
schedule: daily_morning
include_patterns: []        # tighten after verification
exclude_patterns: ["\\.(jpg|png|gif|css|js|zip)$"]
default_tags:
  - us
  - securities
  - broker_dealer
doc_type_rules:
  - pattern: "/notices/"
    doc_type: guidance
  - pattern: "/media-center/"
    doc_type: announcement
staleness_alert_days: 14
backfill_cutoff: 2024-08-01
notes: "Regulatory notices numbered -> reference_number."
