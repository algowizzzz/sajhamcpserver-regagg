# Ontario Securities Commission
# STATUS: candidate sources — run scripts/verify_sources.py before build. See 06_SOURCE_MAP.md
id: osc
name: "Ontario Securities Commission"
jurisdiction: CA
active: true
# Discovery pass 2026-08-03: RSS 404; sitemap index live
connector: sitemap_diff
sources:
  sitemap:
    url: https://www.osc.ca/sitemap.xml
    verified: false
    checked_at: null
  listing_pages:
    - url: https://www.osc.ca/en/securities-law/instruments-rules-policies
      verified: false
      checked_at: null
fetch: html_to_md
rate_limit_rps: 0.5
schedule: daily_morning
include_patterns: []        # tighten after verification
exclude_patterns: ["\\.(jpg|png|gif|css|js|zip)$"]
default_tags:
  - canada
  - securities
doc_type_rules:
  - pattern: "/instruments-rules-policies/"
    doc_type: final_rule
  - pattern: "/news"
    doc_type: announcement
staleness_alert_days: 14
backfill_cutoff: 2024-08-01
notes: "National Instrument numbers -> reference_number."
